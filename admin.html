<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f8ff">
<title>UST JUDO TELEGHMA | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#123b70;--blue:#2584e8;--red:#ef4b55;--green:#169b62;--gold:#a86a00;--purple:#7654d6;--ink:#20344d;--muted:#718198;--line:#e2ebf5;--bg:#f4f8fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(.96)}
input,select{width:100%;padding:11px;border:1px solid #d6e1ef;border-radius:10px;background:white;color:var(--ink)}
label{font-size:13px;color:var(--muted);display:block;margin:5px 0}
header{background:linear-gradient(115deg,#fff,#eef6ff);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand h1{font-size:23px;margin:0;color:var(--navy)}
.brand p{margin:6px 0 0;color:#45658b;font-weight:bold}
.layout{max-width:1600px;margin:auto;display:grid;grid-template-columns:235px minmax(0,1fr);gap:16px;padding:16px}
.sidebar{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;height:max-content}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:right;margin:4px 0;background:transparent;color:#526782}
.navbtn.active{background:#e6f2ff;color:var(--blue)}
.content{min-width:0}
.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #244a7506}
.panel h2{font-size:19px;color:var(--navy);margin:0 0 13px}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:15px;padding:15px;background:#f9fbff;min-height:100px}
.stat .label{font-size:13px;color:#667b95}
.stat .value{font-size:24px;font-weight:800;color:var(--navy);margin-top:10px}
.stat.green{background:#edfff5}.stat.red{background:#fff1f2}.stat.purple{background:#f5f1ff}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0}
.toolbar input,.toolbar
