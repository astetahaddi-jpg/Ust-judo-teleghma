
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c46">
  <title>Admin Dashboard | UST JUDO TELEGHMA</title>

  <style>
    :root {
      --navy: #102c46;
      --red: #d62839;
      --gold: #f2bd54;
      --light: #f4f7fa;
      --white: #fff;
      --border: #dce3ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--light);
      color: #203040;
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--navy);
      color: white;
      text-align: center;
      padding: 22px 12px;
      border-bottom: 5px solid var(--gold);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    header p { margin: 0; }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 14px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 14px #102c4610;
    }

    h2 { color: var(--navy); margin-top: 0; }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input, button {
      font: inherit;
      border-radius: 7px;
      padding: 12px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: var(--navy);
      color: white;
    }

    .danger {
      background: var(--red);
      color: white;
    }

    .gold {
      background: var(--gold);
      color: var(--navy);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .message {
      margin-top: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }

    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
      background: white;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: right;
      vertical-align: top;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    th {
      background: var(--navy);
      color: white;
    }

    .muted { color: #5c6b78; }
    .count { font-weight: bold; color: var(--navy); }

    footer {
      text-align: center;
      padding: 20px;
      color: #5c6b78;
    }
  </style>
</head>

<body>
<header>
  <h1>UST JUDO TELEGHMA</h1>
  <p>لوحة الإدارة | Admin Dashboard</p>
  <p>النادي الرياضي الهاوي الاتحاد الرياضي التلاغمة</p>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>تسجيل دخول المدير | Admin Login</h2>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني | Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        placeholder="admin@example.com"
      >

      <label for="password">كلمة المرور | Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Password"
      >

      <div class="actions">
        <button id="loginBtn" class="primary" type="submit">
          تسجيل الدخول | Login
        </button>
      </div>
    </form>

    <p id="loginMessage" class="message" role="status"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2>لوحة التحكم | Dashboard</h2>
      <p>تم تسجيل الدخول بنجاح.</p>
      <p id="adminEmail" class="muted"></p>

      <div class="actions">
        <button id="refreshBtn" class="primary" type="button">
          تحديث الطلبات | Refresh
        </button>
        <button id="exportBtn" class="gold" type="button">
          تصدير Excel/CSV
        </button>
        <button id="logoutBtn" class="danger" type="button">
          تسجيل الخروج | Logout
        </button>
      </div>

      <p id="dashboardMessage" class="message" role="status"></p>
    </div>

    <div class="panel">
      <h2>طلبات التسجيل | Registration Requests</h2>
      <p>عدد الطلبات: <span id="requestCount" class="count">0</span></p>

      <label for="searchInput">البحث | Search</label>
      <input
        id="searchInput"
        type="search"
        placeholder="ابحث في طلبات التسجيل..."
      >

      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer>
  UST JUDO TELEGHMA — Official Administration
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/*
  Supabase connection
  لا تضع service_role key في هذا الملف.
*/
const SUPABASE_URL =
  "https://jtvorszomguszvygbxbs.supabase.co";

const SUPABASE_PUBLIC_KEY =
  "sb_publishable_pOctimWy9BOucmbJ11epmw_IkzvhZJ6";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLIC_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const $ = id => document.getElementById(id);

let requests = [];
let visibleRequests = [];

function showMessage(element, message, isError = false) {
  element.textContent = message;
  element.style.color = isError ? "#c62828" : "#176b3a";
}

function setBusy(button, busy, normalText, busyText) {
  button.disabled = busy;
  button.textContent = busy ? busyText : normalText;
}

function showLogin() {
  $("loginPanel").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
}

function showDashboard(user) {
  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("adminEmail").textContent =
    "Signed in as: " + (user.email || "Admin");
}

/*
  تحميل طلبات التسجيل فقط.
  لا يتم حذف الطلبات أو تغييرها في قاعدة البيانات.
*/
async function loadRegistrations() {
  showMessage($("dashboardMessage"), "جاري تحميل الطلبات...");

  $("refreshBtn").disabled = true;

  try {
    const { data, error } = await db
      .from("registrations")
      .select("*")
      .limit(1000);

    if (error) throw error;

    requests = Array.isArray(data) ? data : [];
    renderTable();

    showMessage(
      $("dashboardMessage"),
      "تم تحميل الطلبات بنجاح."
    );
  } catch (error) {
    requests = [];
    renderTable();

    showMessage(
      $("dashboardMessage"),
      "تعذر تحميل الطلبات: " +
        (error.message || "حدث خطأ غير معروف") +
        ". تحقق من صلاحيات Supabase وRLS.",
      true
    );
  } finally {
    $("refreshBtn").disabled = false;
  }
}

function renderTable() {
  const query = $("searchInput").value
    .trim()
    .toLocaleLowerCase();

  visibleRequests = requests.filter(row =>
    JSON.stringify(row)
      .toLocaleLowerCase()
      .includes(query)
  );

  $("requestCount").textContent = visibleRequests.length;

  const head = $("tableHead");
  const body = $("tableBody");

  head.replaceChildren();
  body.replaceChildren();

  if (visibleRequests.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");

    td.colSpan = Math.max(
      1,
      requests.length ? Object.keys(requests[0]).length : 1
    );

    td.textContent = requests.length
      ? "لا توجد نتائج مطابقة."
      : "لا توجد طلبات للعرض، أو لم يتم تحميلها.";

    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }

  const columns = Object.keys(visibleRequests[0]);
  const headerRow = document.createElement("tr");

  columns.forEach(column => {
    const th = document.createElement("th");
    th.textContent = column;
    headerRow.appendChild(th);
  });

  head.appendChild(headerRow);

  visibleRequests.forEach(row => {
    const tr = document.createElement("tr");

    columns.forEach(column => {
      const td = document.createElement("td");
      const value = row[column];

      td.textContent =
        value === null || value === undefined
          ? ""
          : typeof value === "object"
            ? JSON.stringify(value)
            : String(value);

      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
}

function exportCSV() {
  if (!visibleRequests.length) {
    showMessage(
      $("dashboardMessage"),
      "لا توجد بيانات لتصديرها.",
      true
    );
    return;
  }

  const columns = Object.keys(visibleRequests[0]);

  const escapeCSV = value => {
    const text = value === null || value === undefined
      ? ""
      : typeof value === "object"
        ? JSON.stringify(value)
        : String(value);

    return '"' + text.replace(/"/g, '""') + '"';
  };

  const rows = [
    columns.map(escapeCSV).join(","),
    ...visibleRequests.map(row =>
      columns.map(column => escapeCSV(row[column])).join(",")
    )
  ];

  // BOM للمحافظة على العربية عند فتح CSV في Excel.
  const blob = new Blob(
    ["\uFEFF" + rows.join("\r\n")],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "UST-JUDO-registrations.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("loginBtn");
  const email = $("email").value.trim();
  const password = $("password").value;

  showMessage($("loginMessage"), "");
  setBusy(button, true, "تسجيل الدخول | Login", "جاري الدخول...");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (!data.user) {
      throw new Error("لم يتم العثور على حساب المستخدم.");
    }

    showDashboard(data.user);
    $("password").value = "";

    await loadRegistrations();
  } catch (error) {
    showMessage(
      $("loginMessage"),
      "تعذر تسجيل الدخول: " +
        (error.message || "تحقق من البريد الإلكتروني وكلمة المرور."),
      true
    );
  } finally {
    setBusy(button, false, "تسجيل الدخول | Login", "");
  }
});

$("refreshBtn").addEventListener("click", loadRegistrations);

$("exportBtn").addEventListener("click", exportCSV);

$("searchInput").addEventListener("input", renderTable);

$("logoutBtn").addEventListener("click", async () => {
  const button = $("logoutBtn");
  button.disabled = true;

  try {
    const { error } = await db.auth.signOut();
    if (error) throw error;

    requests = [];
    renderTable();
    showLogin();

    showMessage(
      $("loginMessage"),
      "تم تسجيل الخروج بنجاح."
    );
  } catch (error) {
    showMessage(
      $("dashboardMessage"),
      "تعذر تسجيل الخروج: " + error.message,
      true
    );
  } finally {
    button.disabled = false;
  }
});

/*
  استعادة الجلسة إذا سبق تسجيل الدخول.
*/
async function initialize() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    if (data.session && data.session.user) {
      showDashboard(data.session.user);
      await loadRegistrations();
    } else {
      showLogin();
    }
  } catch (error) {
    showLogin();
    showMessage(
      $("loginMessage"),
      "تعذر التحقق من الجلسة: " + error.message,
      true
    );
  }
}

initialize();
</script>
</body>
</html>
